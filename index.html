<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>WEB PLAYER - NOVAPLAY</title>
    <link rel="icon" type="image/webp" href="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e50914;
            --bg: #000000;
            --overlay: rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Inter', sans-serif; }

        #player-container { width: 100vw; height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        /* Pantalla Evento Finalizado */
        #event-ended { position: absolute; inset: 0; z-index: 5000; display: none; align-items: center; justify-content: center; flex-direction: column; background: var(--bg); text-align: center; padding: 30px; }
        #event-ended img { width: 120px; margin-bottom: 30px; filter: drop-shadow(0 0 20px rgba(229, 9, 20, 0.4)); }
        #event-ended h1 { color: #fff; font-size: clamp(24px, 5vw, 42px); font-weight: 900; margin: 0 0 15px; letter-spacing: -1px; }
        #event-ended p { color: #888; font-size: 18px; max-width: 600px; line-height: 1.5; margin: 0; }
        #event-status { margin-top: 30px; color: var(--primary); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 2px; }

        /* UI Overlays */
        .watermark { position: absolute; top: 30px; right: 30px; width: 100px; opacity: 0.5; pointer-events: none; z-index: 1000; transition: 0.3s; }

        #debug-log { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8); border: 1px solid #333; border-radius: 10px; color: #0f0; font-family: monospace; font-size: 10px; z-index: 9999; max-height: 150px; overflow-y: auto; width: 250px; padding: 15px; display: none; }

        #fullscreen-btn { position: absolute; bottom: 30px; right: 30px; z-index: 2000; width: 50px; height: 50px; border: none; border-radius: 50%; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); color: white; font-size: 24px; cursor: pointer; opacity: 0; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        #player-container:hover #fullscreen-btn, #player-container:hover .watermark { opacity: 1; }
        #fullscreen-btn:hover { background: var(--primary); transform: scale(1.1); }

        /* Custom Loading */
        #loader { position: absolute; width: 50px; height: 50px; border: 4px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; z-index: 10; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="player-container">
    <div id="loader"></div>
    <div id="debug-log"></div>

    <video id="video" autoplay playsinline muted controls disablepictureinpicture controlslist="nodownload"></video>

    <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp" class="watermark" alt="NovaPlay">

    <button id="fullscreen-btn" title="Pantalla completa">⛶</button>

    <!-- EVENTO FINALIZADO -->
    <div id="event-ended">
        <img src="https://raw.githubusercontent.com/novaplaytv/novaimg/main/novasplash.webp" alt="NovaPlay">
        <h1>EVENTO FINALIZADO</h1>
        <p>La transmisión se reactivará automáticamente cuando inicie el próximo evento programado.</p>
        <div id="event-status">Sincronizando señal...</div>
    </div>
</div>

<script>
(function() {
    const video = document.getElementById('video');
    const loader = document.getElementById('loader');
    const eventEnded = document.getElementById('event-ended');
    const eventStatus = document.getElementById('event-status');
    const fsBtn = document.getElementById('fullscreen-btn');
    const logger = document.getElementById('debug-log');

    let hls = null;
    let currentUrl = "";
    let endedUrl = "";
    const JSON_URL = "https://mrghnngupolsgatcmevw.supabase.co/storage/v1/object/public/Novaplay/novaplay.json";

    function log(m) {
        const d = document.createElement('div');
        d.textContent = `> ${m}`;
        logger.appendChild(d);
        logger.scrollTop = logger.scrollHeight;
    }

    async function getSignal() {
        try {
            const r = await fetch(JSON_URL + "?t=" + Date.now(), { cache: "no-store" });
            const data = await r.json();
            for (const cat of data) {
                const ch = cat.items?.find(i => i.name === "NOVASPORTS");
                if (ch) return ch.url || "";
            }
        } catch (e) { log("Error datos: " + e.message); }
        return "";
    }

    async function validateSignal(url) {
        try {
            const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
            return r.ok;
        } catch (e) { return null; }
    }

    async function playSignal(url) {
        if (endedUrl === url || (currentUrl === url && hls)) return;

        loader.style.display = 'block';
        currentUrl = url;
        eventEnded.style.display = 'none';

        if (Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls({ lowLatencyMode: true, manifestLoadingMaxRetry: 0 });
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(() => {});
                loader.style.display = 'none';
            });
            hls.on(Hls.Events.ERROR, (e, d) => {
                if (d.fatal) {
                    endedUrl = url;
                    eventEnded.style.display = 'flex';
                    loader.style.display = 'none';
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            loader.style.display = 'none';
        }
    }

    async function monitor() {
        const url = await getSignal();
        if (!url) {
            eventEnded.style.display = 'flex';
            loader.style.display = 'none';
        } else {
            await playSignal(url);
        }
    }

    fsBtn.onclick = () => {
        if (!document.fullscreenElement) document.getElementById('player-container').requestFullscreen();
        else document.exitFullscreen();
    };

    setInterval(monitor, 30000);
    monitor();
})();
</script>
</body>
</html>
